image: node:18

stages:
  - install
  - lint
  - test
  - sonar
  - build
  - deploy

# Pipeline kouri sou dev + main
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

install_dependencies:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/

lint_code:
  stage: lint
  script:
    - npm run lint
    - npm run prettier
  allow_failure: false

run_tests:
  stage: test
  script:
    - npm run test
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

sonarqube_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner
      -Dsonar.projectKey=MF
      -Dsonar.organization=apibusiness
      -Dsonar.sources=src
      -Dsonar.tests=tests
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
  allow_failure: false

build_project:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/

deploy_prod:
  stage: deploy
  script:
    - echo "Déploiement en production..."
  only:
    - main
